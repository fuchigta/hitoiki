# cargo-deny 設定
# 実行: cargo deny check
# 依存クレートは permissive ライセンスのみ許可する（AGENTS.md / docs/dev/architecture.md「配布とライセンス」）。

[graph]
# 対象ターゲット。Windows 以外のターゲットも含めて依存を検査する。
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = false

[advisories]
version = 2
# 既知の脆弱性（RustSec）は cargo-deny のデフォルトで拒否される。
# 未メンテナンスの警告は情報として扱う。
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# 許可リスト。ここに無いライセンスはエラーになる。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# 許可リストに無いもの（GPL/AGPL/LGPL 等のコピーレフト系を含む）はすべて拒否される。

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ワークスペース内の path 依存はワイルドカード扱いにしない。
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
