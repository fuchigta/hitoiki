[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fuchigta/hitoiki"
rust-version = "1.80"

[workspace.dependencies]
hitoiki-core = { path = "crates/hitoiki-core" }
hitoiki-collect = { path = "crates/hitoiki-collect" }
hitoiki-collect-win = { path = "crates/hitoiki-collect-win" }
hitoiki-agents = { path = "crates/hitoiki-agents" }
hitoiki-calendar = { path = "crates/hitoiki-calendar" }
hitoiki-judge = { path = "crates/hitoiki-judge" }
hitoiki-ipc = { path = "crates/hitoiki-ipc" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
regex = "1"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"
crossbeam-channel = "0.5"
windows = "0.62"
which = "7"
