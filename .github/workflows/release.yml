name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # hitoiki-app は ui/dist を exe に埋め込むので、Rust のビルド前にフロントエンドを作る。
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build CLI and app
        run: cargo build --release -p hitoiki-cli -p hitoiki-app

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $staging = Join-Path $env:RUNNER_TEMP "hitoiki-$ver"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # CLI と常駐アプリはどちらも必須（欠けていればここで失敗させる）
          foreach ($exe in 'hitoiki.exe', 'hitoiki-app.exe') {
            Copy-Item "target/release/$exe" -Destination $staging -ErrorAction Stop
          }
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $staging

          $zip = "hitoiki-$ver-windows-x64.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
