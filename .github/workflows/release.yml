name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # hitoiki-app は ui/dist を exe に埋め込むので、Rust のビルド前にフロントエンドを作る。
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Check version
        shell: pwsh
        run: |
          # タグと tauri.conf.json の version が食い違うと、インストーラーの表示が実体と合わなくなる。
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content crates/hitoiki-app/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $ver) { throw "tauri.conf.json の version ($conf) がタグ ($ver) と一致しません" }

      # GitHub Release の本文に使う CHANGELOG.md の該当バージョンの節を取り出す。
      # 節が無い、または中身が空ならリリースを失敗させる（CHANGELOG の更新漏れを防ぐ）。
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $heading = '## [' + $ver + ']'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md に '$heading' の節がありません" }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('## [')) { break }
            $body.Add($lines[$i])
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) { throw "CHANGELOG.md の '$heading' の節が空です" }
          $path = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($path, $text + "`n", (New-Object System.Text.UTF8Encoding($false)))
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ポータブル版（zip）用。CLI と常駐アプリを素のバイナリとしてビルドする。
      - name: Build CLI and app
        run: cargo build --release -p hitoiki-cli -p hitoiki-app

      # インストーラーには CLI をサイドカー（externalBin）として同梱する。
      # Tauri はターゲットトリプル付きの名前を要求し、インストール時に接尾辞が外れて hitoiki.exe になる。
      - name: Place CLI sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/hitoiki-app/binaries | Out-Null
          Copy-Item target/release/hitoiki.exe crates/hitoiki-app/binaries/hitoiki-x86_64-pc-windows-msvc.exe -ErrorAction Stop

      # @tauri-apps/cli は ui/package.json の devDependency（npm ci 済み）。
      - name: Build NSIS installer
        working-directory: crates/hitoiki-app
        run: ../../ui/node_modules/.bin/tauri build --bundles nsis --config tauri.bundle.conf.json

      - name: Package artifacts
        id: pack
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''

          # インストーラー
          $setup = Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'インストーラーが生成されていません' }
          $installer = "hitoiki-$ver-windows-x64-setup.exe"
          Copy-Item $setup.FullName $installer
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # ポータブル版 zip
          $staging = Join-Path $env:RUNNER_TEMP "hitoiki-$ver"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # CLI と常駐アプリはどちらも必須（欠けていればここで失敗させる）
          foreach ($exe in 'hitoiki.exe', 'hitoiki-app.exe') {
            Copy-Item "target/release/$exe" -Destination $staging -ErrorAction Stop
          }
          # README のリンク先（docs/）が zip 内でも辿れるよう、文書も同梱する。
          Copy-Item "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $staging
          Copy-Item "docs" -Destination $staging -Recurse

          $zip = "hitoiki-$ver-windows-x64.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.pack.outputs.installer }}
            ${{ steps.pack.outputs.zip }}
