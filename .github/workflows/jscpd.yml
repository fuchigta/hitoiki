name: jscpd

# コピー＆ペーストによる重複が増えていないかを確かめる。jscpd は ui/package.json の依存に
# 入れず、npx の版指定で固定する。設定は .jscpd.json にあり、JSON にはコメントを
# 書けないので設定の根拠はここに残す。
#
# - 版: jscpd 5.4.3（Rust エンジン）。crates/*/src/ の Rust、ui/src/ の TSX・TS・CSS の
#   ほか、SQL（マイグレーション）・TOML・JSON・YAML・HTML・NSIS・PowerShell と
#   crates/hitoiki-core/prompts/ の Markdown も測る
# - 検出の基準: 既定値（min-tokens 50・min-lines 5・mode mild）で exact のみ。
#   .gitignore は既定で除外される（target/、node_modules/ など）
# - 実測（2026-11-24）: 254 ファイル・82 クローン、重複率は行 1.31%・トークン 1.37%
#   （この jscpd.yml を含む）
#   - 本番コード 66 件・648 行: crates/hitoiki-core/src/repo/ の行の読み出し（raw.rs と
#     calendar.rs・confirmation.rs など）、ui/src/ の rule-row.tsx 内の繰り返しと
#     key-result-picker.tsx と skill-picker.tsx、構造化版と通常版の振り返りプロンプト
#     （prompts/*.md）、ci.yml と release.yml のセットアップ手順など
#   - テスト由来 16 件・142 行: #[cfg(test)] で同じファイルにあるテスト（key_result_summary.rs・
#     correction.rs など）。パスでは外せないため測定に含まれる。テストは素直に書く方針なので
#     重複を解消するための書き換えはしない
# - threshold: 行の重複率と比べられ、超えたときだけ失敗する。表示は 1.31% だが実際は
#   790 / 60,190 = 1.3125…% のため、1.32 では通り 1.31 では落ちる（確認済み）。実測に約 0.5 ポイントの余裕を持たせて 1.8 に置くラチェットとして
#   扱い、重複を減らして実測が下がったら threshold も引き下げる
# - ignore（除外しないと 448 ファイル・172 クローン・行 6.51%・トークン 5.60%）:
#   - .agents/・.claude/: 同梱した spotter のスキル。同じ文書が両方にあり、それだけで
#     128 件の箇所がクローンになる（Markdown・YAML・テキスト）
#   - ui/package-lock.json: npm の生成物のため外す。測定に入り（1,885 行）、重複率を薄める
#   - Cargo.lock: cargo の生成物のため外す（jscpd は今は拾わないが明示的に外す）
#   - README.md・CHANGELOG.md・AGENTS.md・GLOSSARY.md・docs/: 文書。Markdown 内の
#     コードブロックも数えられるため外す（今はクローンを含まない）
#   - crates/*/tests/・crates/*/src/**/tests.rs・ui/src/**/*.test.*: テストファイル。
#     本番コードの重複だけをゲートで見る（tests.rs だけで 13 件のクローンがある）
#   - ui/src/dev/・ui/scripts/: 開発用の画面とスクリプト。cccc.toml でも除外している
#   - 手元で測るときは --ignore を渡さず .jscpd.json を使う。CLI の --ignore は .jscpd.json の
#     ignore に足されるのではなく置き換えるため、数値がずれる
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jscpd:
    name: jscpd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jscpd
        run: npx --yes jscpd@5.4.3 --no-tips --no-colors .
